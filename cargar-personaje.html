<main class="contacto">
  <h1>⚔️ Cargar Personaje</h1>

  <form id="formPersonaje">
    <label>Nombre *</label>
    <input type="text" id="nombre" required>

    <label>Título *</label>
    <input type="text" id="titulo" required>

    <label>URL de Imagen *</label>
    <input type="url" id="imagen" required>

    <label>Casa *</label>
    <input type="text" id="casa" placeholder="Stark, Lannister, Targaryen..." required>

    <button type="submit">Guardar Personaje</button>
  </form>
</main>
